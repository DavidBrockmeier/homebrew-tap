name: Build molten-vk

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: molten-vk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS 26 ARM64 / private APIs enabled
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_MAKE_JOBS: "3"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Prepare Homebrew and tap
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          brew update
          brew tap --custom-remote DavidBrockmeier/tap "$GITHUB_WORKSPACE"
          if brew help trust >/dev/null 2>&1; then
            brew trust --formula DavidBrockmeier/tap/molten-vk
          fi
      - name: Check formula syntax
        run: ruby -c Formula/molten-vk.rb
      - name: Install the core package to exercise the same-name replacement
        run: brew install homebrew/core/molten-vk
      - name: Build replacement formula
        run: brew reinstall --build-from-source DavidBrockmeier/tap/molten-vk
      - name: Verify installed package
        run: |
          ruby -rjson -e 'tab = JSON.parse(File.read(ARGV.fetch(0))); abort "Wrong formula installed" unless tab.fetch("source").fetch("tap").downcase == "davidbrockmeier/tap"' \
            "$(brew --prefix molten-vk)/INSTALL_RECEIPT.json"
          brew linkage --test DavidBrockmeier/tap/molten-vk
          file "$(brew --prefix molten-vk)/lib/libMoltenVK.dylib"
      - name: Test Vulkan initialization when a Metal device is available
        run: |
          if swift -e 'import Metal; import Darwin; exit(MTLCreateSystemDefaultDevice() == nil ? 1 : 0)'; then
            brew test DavidBrockmeier/tap/molten-vk
          else
            echo "::notice::This runner has no usable Metal device; build and linkage were checked, GPU initialization was not."
          fi
